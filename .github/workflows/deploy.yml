name: Build & Deploy payment-service

on:
  push:
    branches: [main]

env:
  APP_NAME: payment-service
  RESOURCE_GROUP: trafficschool-rg
  ENVIRONMENT: trafficschool-env

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Logga in på Azure
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Logga in på ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Bygg och pusha Docker-image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.APP_NAME }}:latest

      - name: Driftsätt till Azure Container Apps
        run: |
          az containerapp up \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --environment ${{ env.ENVIRONMENT }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.APP_NAME }}:latest \
            --registry-server ${{ secrets.ACR_LOGIN_SERVER }} \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --target-port 8083 \
            --ingress internal \
            --min-replicas 1 \
            --max-replicas 2 \
            --env-vars \
              SPRING_PROFILES_ACTIVE=prod \
              MYSQLHOST=${{ secrets.MYSQL_HOST }} \
              MYSQLPORT=3306 \
              MYSQLDATABASE=paymentServiceDb \
              MYSQLUSER=${{ secrets.MYSQL_USER }} \
              MYSQLPASSWORD=${{ secrets.MYSQL_PASSWORD }} \
              SERVICE_API_KEY=${{ secrets.SERVICE_API_KEY }} \
              SWISH_CALLBACK_URL=${{ secrets.SWISH_CALLBACK_URL }} \
              SWISH_MERCHANT_NUMBER=${{ secrets.SWISH_MERCHANT_NUMBER }} \
              SWISH_KEYSTORE_PATH=${{ secrets.SWISH_KEYSTORE_PATH }} \
              SWISH_KEYSTORE_PASSWORD=${{ secrets.SWISH_KEYSTORE_PASSWORD }} \
              SWISH_CA_CERT_PATH=${{ secrets.SWISH_CA_CERT_PATH }} \
              EUREKA_URL=http://eureka-server/eureka/
