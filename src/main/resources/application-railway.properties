# Railway-specific configuration for paymentService

# Eureka Instance Configuration
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:paymentservice-production-f19c.up.railway.app}
eureka.instance.non-secure-port=${EUREKA_INSTANCE_NON_SECURE_PORT:8085}
eureka.instance.instance-id=${eureka.instance.hostname}:${spring.application.name}:${eureka.instance.non-secure-port}
