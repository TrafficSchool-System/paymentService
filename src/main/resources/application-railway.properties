# Railway-specific configuration for paymentService

# Eureka Instance Configuration for Railway's public HTTPS domains
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:paymentservice-production-f19c.up.railway.app}
eureka.instance.secure-port-enabled=true
eureka.instance.secure-port=443
eureka.instance.non-secure-port-enabled=false
eureka.instance.instance-id=${eureka.instance.hostname}:${spring.application.name}:${eureka.instance.secure-port}
