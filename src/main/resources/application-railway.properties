# Railway-specific configuration for paymentService

# Database - Railway MySQL
# Railway provides: MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Eureka Instance Configuration for Railway internal network
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=paymentservice.railway.internal
