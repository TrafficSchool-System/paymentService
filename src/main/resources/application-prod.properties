# ==========================================
# PRODUCTION PROFILE (Railway/Docker/Kubernetes)
# ==========================================
# Activate: SPRING_PROFILES_ACTIVE=prod (set via environment variable)
# Used for: Railway, Docker Compose, Kubernetes deployments

# =========================
# DATABASE - DEDICATED FOR PAYMENT SERVICE
# =========================
# CRITICAL: Each microservice MUST have its own database!
# 
# RAILWAY SETUP (Recommended):
# 1. Create separate MySQL instance for PaymentService
# 2. Set these environment variables in Railway:
#    - MYSQLHOST=your-payment-db-host.railway.app
#    - MYSQLPORT=3306
#    - MYSQLDATABASE=paymentServiceDb
#    - MYSQLUSER=root
#    - MYSQLPASSWORD=<generated-password>
#
# DOCKER COMPOSE:
# Uses service name: mysql-payment:3306
#
# KUBERNETES:
# Uses service name: payment-mysql-service:3306
spring.datasource.url=jdbc:mysql://${MYSQLHOST:mysql-payment}:${MYSQLPORT:3306}/${MYSQLDATABASE:paymentServiceDb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD}

# =========================
# SERVER
# =========================
# Railway uses PORT environment variable
server.port=${PORT:8083}

# =========================
# EUREKA - ENABLED
# =========================
# In production, services discover each other via Eureka
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka-server:8761/eureka/}

# Eureka Instance Configuration
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${SERVICE_NAME:payment-service}
eureka.instance.non-secure-port=8083
eureka.instance.instance-id=${eureka.instance.hostname}:${server.port}

# =========================
# SERVICE URLS - EUREKA SERVICE DISCOVERY
# =========================
# Uses Eureka service names (resolved via LoadBalancer)
user-service.base-url=http://user-service

# =========================
# SWISH - PRODUCTION ENVIRONMENT
# =========================
# OVERRIDE these in Railway/Production with real values!
swish.base-url=${SWISH_BASE_URL:https://cpc.getswish.net}
swish.merchant-number=${SWISH_MERCHANT_NUMBER}
swish.callback-url=${SWISH_CALLBACK_URL}
swish.key-store-path=${SWISH_KEYSTORE_PATH}
swish.key-store-password=${SWISH_KEYSTORE_PASSWORD}
swish.ca-cert-path=${SWISH_CA_CERT_PATH}

# =========================
# LOGGING - INFO FOR PRODUCTION
# =========================
logging.level.com.example.paymentService=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN

# =========================
# JPA - HIDE SQL IN PRODUCTION
# =========================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =========================
# ACTUATOR - PRODUCTION HEALTH CHECKS
# =========================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
