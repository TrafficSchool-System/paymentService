spring.application.name=payment-service
server.port=${SERVER_PORT:8085}

# Logging
spring.output.ansi.enabled=ALWAYS
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx

# MySQL Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/paymentServiceDb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Discovery
eureka.client.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true


# Swish Configuration
# I produktion: Byt till produktions-URL och certifikat
swish.base-url=${SWISH_BASE_URL:https://mss.cpc.getswish.net}
swish.merchant-number=${SWISH_MERCHANT_NUMBER:1234679304}
swish.callback-url=${SWISH_CALLBACK_URL:https://unharsh-larita-lexicographic.ngrok-free.dev/api/webhooks/swish}
swish.key-store-path=${SWISH_KEYSTORE_PATH:classpath:certificates/Swish_Merchant_TestCertificate_1234679304.p12}
swish.key-store-password=${SWISH_KEYSTORE_PASSWORD:}
swish.ca-cert-path=${SWISH_CA_CERT_PATH:classpath:certificates/Swish_TLS_RootCA.pem}

# TLS certificate
server.ssl.enabled=false

# UserService configuration (via Eureka Service Discovery)
user-service.base-url=http://user-service

# JWT Configuration - REFACTORED  
# PaymentService läser INTE JWT tokens längre!
# Gateway validerar JWT och sätter X-User-Id, X-User-Email, X-User-Role headers
# PaymentService läser dessa headers via GatewayHeaderAuthenticationFilter

# Service-to-Service API Key
# VIKTIGT: Denna nyckel används när PaymentService kommunicerar med UserService
# Måste vara samma som i UserService! Ändra i produktion med miljövariabel SERVICE_API_KEY
service.api.key=${SERVICE_API_KEY:TrafficSchool-Internal-Key-2026-CHANGE-IN-PROD}