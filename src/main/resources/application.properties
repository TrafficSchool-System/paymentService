# ==========================================
# SHARED CONFIGURATION (ALL ENVIRONMENTS)
# ==========================================
# This file contains configuration shared between ALL profiles
# Profile-specific overrides are in:
# - application-local.properties (local development)
# - application-prod.properties (Railway/Docker/K8s)

# =========================
# APPLICATION
# =========================
spring.application.name=payment-service

# Default profile (can be overridden with SPRING_PROFILES_ACTIVE env var)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# =========================
# DATABASE - SHARED CONFIG
# =========================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.pool-name=PaymentServiceHikariPool

# =========================
# JPA/HIBERNATE - SHARED CONFIG
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Timezone - UTC for consistency across all environments
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC

# =========================
# LOGGING - SHARED PATTERN
# =========================
spring.output.ansi.enabled=ALWAYS
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx

# =========================
# SECURITY - API KEYS
# =========================
# Service-to-Service Authentication
# CRITICAL: Override in production with SERVICE_API_KEY environment variable!
service.api.key=${SERVICE_API_KEY:TrafficSchool-Internal-Key-2026-CHANGE-IN-PROD}

# =========================
# ACTUATOR - SHARED CONFIG
# =========================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# =========================
# SSL - DISABLED (use reverse proxy in production)
# =========================
server.ssl.enabled=false