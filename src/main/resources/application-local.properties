# ==========================================
# LOCAL DEVELOPMENT PROFILE
# ==========================================
# Activate: spring.profiles.active=local (default)
# Used for: Local development on your machine

# =========================
# DATABASE - DEDICATED FOR PAYMENT SERVICE
# =========================
# Each microservice has its own database (Database per Service Pattern)
spring.datasource.url=jdbc:mysql://localhost:3306/paymentServiceDb?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# =========================
# SERVER
# =========================
server.port=8083

# =========================
# EUREKA - ENABLED (Gateway använder lb://)
# =========================
# Services registrerar sig i Eureka för service discovery
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# =========================
# SERVICE URLS - DIRECT HTTP
# =========================
# Direct HTTP to localhost (no LoadBalancer)
user-service.base-url=http://localhost:8081

# =========================
# SWISH - TEST ENVIRONMENT
# =========================
swish.base-url=https://mss.cpc.getswish.net
swish.merchant-number=1234679304
swish.callback-url=https://unharsh-larita-lexicographic.ngrok-free.dev/api/webhooks/swish
swish.key-store-path=classpath:certificates/Swish_Merchant_TestCertificate_1234679304.p12
swish.key-store-password=swish
swish.ca-cert-path=classpath:certificates/Swish_TLS_RootCA.pem

# =========================
# JPA
# =========================
logging.level.org.springframework.security=DEBUG

# =========================
# JPA - SHOW SQL
# =========================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
